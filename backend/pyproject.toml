[project]
name = "tendersense-backend"
version = "1.8.0"
description = "TenderSense — tender discovery and matching SaaS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "greenlet>=3.1",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.28",
    "selectolax>=0.3.21",
    "google-genai>=2.3,<3.0",
    "tenacity>=9.0",
    "aiolimiter>=1.2",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.10",
    "authlib>=1.4",
    "itsdangerous>=2.2",
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    "structlog>=24.4",
    "prometheus-fastapi-instrumentator>=7.0",
    "uuid-utils>=0.10",
    "python-multipart>=0.0.20",
    "babel>=2.16",
    "sentry-sdk[fastapi]>=2.19",
]

[project.optional-dependencies]
scrape = ["playwright>=1.49"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "testcontainers[postgres]>=4.9",
    "respx>=0.22",
    "time-machine>=2.16",
    "polyfactory>=2.18",
    "types-python-dateutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "T20", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"tests/*" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_decorators = false
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["selectolax.*", "arq.*", "authlib.*", "pgvector.*", "uuid_utils.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: hits real external services; run manually with -m live",
]
filterwarnings = ["error::DeprecationWarning:app.*"]
