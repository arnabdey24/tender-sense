# Local development: exposed ports and hot reload.
services:
  db:
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"

  # Mounted for the same reason `api` is: `make migration` autogenerates into
  # the working tree via `api`, so without this mount `make migrate` runs the
  # image's older copy and fails with "Can't locate revision".
  migrate:
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic

  api:
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DEBUG: "true"
      LOG_JSON: "false"
      LOG_LEVEL: DEBUG
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/scripts:/app/scripts
      - ./backend/data:/app/data
    ports:
      - "${API_PORT_HOST:-8000}:8000"

  worker:
    environment:
      LOG_JSON: "false"
      LOG_LEVEL: DEBUG
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data

  worker-scrape:
    environment:
      LOG_JSON: "false"
      LOG_LEVEL: DEBUG
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
