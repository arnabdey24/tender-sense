<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>TenderSense</title>
    <meta
      name="description"
      content="Find, grade and win the public tenders that matter to your business. TenderSense watches procurement portals, matches every notice against your capability profile, and explains the grade against the evidence."
    />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Both themes are designed, so declare both and let the OS pick. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fcfdfe" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1216" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="TenderSense" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="TenderSense" />
    <meta
      property="og:description"
      content="Find, grade and win the public tenders that matter to your business."
    />
    <meta property="og:image" content="/icon-512.png" />

    <!--
      Resolves the theme before first paint; see public/theme.js. It is a file
      and not an inline script because the proxy serves this page under
      `script-src 'self'`, which blocked the inline version — so the script that
      exists to prevent a white flash was the one thing guaranteed not to run.
    -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
